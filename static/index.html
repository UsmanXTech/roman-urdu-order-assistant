<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Usman Clothing Store — Order Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5; height: 100dvh;
    display: flex; flex-direction: column; max-width: 640px; margin: 0 auto;
  }
  header {
    background: #1f2937; color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #10b981; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; flex-shrink: 0;
  }
  header h1 { font-size: 16px; }
  header p { font-size: 12px; color: #9ca3af; }
  .dot { color: #10b981; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
  .bot { background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .user { background: #1f2937; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .typing { color: #6b7280; font-style: italic; }
  #chips { display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; background: #f0f2f5; }
  .chip {
    flex-shrink: 0; border: 1px solid #1f2937; color: #1f2937; background: #fff;
    border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  #bar { display: flex; gap: 8px; padding: 10px 12px 14px; background: #fff; border-top: 1px solid #e5e7eb; }
  #input {
    flex: 1; border: 1px solid #d1d5db; border-radius: 24px;
    padding: 11px 16px; font-size: 15px; outline: none;
  }
  #send {
    background: #1f2937; color: #fff; border: none; border-radius: 50%;
    width: 46px; height: 46px; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <div class="avatar">U</div>
  <div>
    <h1>Usman Clothing Store</h1>
    <p><span class="dot">●</span> <span id="mode">connecting…</span></p>
  </div>
</header>
<div id="chat"></div>
<div id="chips">
  <button class="chip">sab dikhao</button>
  <button class="chip">kurta ki qimat</button>
  <button class="chip">jeans mein kaunse sizes hain</button>
  <button class="chip">order karna hai</button>
</div>
<div id="bar">
  <input id="input" type="text" placeholder="Apna sawal likhein…" autocomplete="off">
  <button id="send">➤</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const sessionId = 'web-' + Math.random().toString(36).slice(2, 9);

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send(text) {
  text = (text || input.value).trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  const t = addMsg('likh raha hai…', 'bot typing');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId})
    });
    const data = await r.json();
    t.classList.remove('typing');
    t.textContent = data.reply;
  } catch (e) {
    t.classList.remove('typing');
    t.textContent = 'Connection mein masla hai. Dobara koshish karein.';
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.onclick = () => send();
input.onkeydown = e => { if (e.key === 'Enter') send(); };
document.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));

fetch('/api/status').then(r => r.json()).then(s => {
  document.getElementById('mode').textContent = 'online • ' + s.llm_mode;
}).catch(() => {
  document.getElementById('mode').textContent = 'offline';
});

addMsg('Assalam-o-Alaikum! Usman Clothing Store mein khush aamdeed. Kapron ke baare mein poochein ya order karein — mein Roman Urdu mein madad karunga.', 'bot');
</script>
</body>
</html>
